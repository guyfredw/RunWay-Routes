<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunWay Routes test viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  #panel { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  select { font: inherit; padding: 6px; max-width: 100%; }
  #stats { width: 100%; }
  #map { height: calc(100vh - 110px); min-height: 360px; }
  .key { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="panel">
  <select id="route" aria-label="Route"></select>
  <label><input type="checkbox" id="base"> Show comparison route (gray)</label>
  <div>
    <span class="key" style="background:#d62728"></span>Long wait (5+ lanes)
    <span class="key" style="background:#ff7f0e"></span>Medium wait (3&ndash;4 lanes)
    <span class="key" style="background:#f2c200"></span>Short wait (1&ndash;2 lanes)
    <span class="key" style="background:#fff;border:3px solid #111;width:8px;height:8px"></span>Traffic signal
    <span class="key" style="background:#8e44ad;border-radius:2px;height:4px;vertical-align:3px"></span>No sign of a sidewalk
  </div>
  <div id="stats"></div>
</div>
<div id="map"></div>
<script>
const DATA = /*DATA*/null;
const COLORS = { long: '#d62728', medium: '#ff7f0e', short: '#f2c200' };
const select = document.getElementById('route');
DATA.forEach((d, i) => select.add(new Option(d.label, i)));
const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [-80.35, 25.82], zoom: 13 });
map.addControl(new maplibregl.NavigationControl());
const line = (coords) => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords || [] }, properties: {} });
const describe = (s) => `${s.km} km, ${s.total} estimated stops (${s.long} long, ${s.medium} medium, ${s.short} short waits; ${s.signals} with signals), ${s.noSidewalkM} m with no sign of a sidewalk`;
function show() {
  const d = DATA[+select.value];
  const showBase = document.getElementById('base').checked && d.baseline;
  map.getSource('runway').setData(line(d.runway.coords));
  map.getSource('baseline').setData(line(showBase ? d.baseline.coords : []));
  map.getSource('events').setData({ type: 'FeatureCollection', features: d.runway.events.map((e) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [e.lon, e.lat] }, properties: { color: COLORS[e.wait], stroke: e.signal ? '#111' : '#fff', width: e.signal ? 3 : 1 } })) });
  map.getSource('nosidewalk').setData({ type: 'FeatureCollection', features: (d.runway.noSidewalk || []).map((c) => line(c)) });
  map.getSource('start').setData({ type: 'Point', coordinates: [d.start.lon, d.start.lat] });
  document.getElementById('stats').textContent = `RunWay: ${describe(d.runway.stats)}` + (d.baseline ? ` | Comparison: ${describe(d.baseline.stats)}` : '');
  const bounds = d.runway.coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(d.runway.coords[0], d.runway.coords[0]));
  map.fitBounds(bounds, { padding: 40, duration: 0 });
}
map.on('load', () => {
  for (const id of ['baseline', 'runway']) map.addSource(id, { type: 'geojson', data: line([]) });
  map.addSource('events', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource('nosidewalk', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource('start', { type: 'geojson', data: { type: 'Point', coordinates: [0, 0] } });
  map.addLayer({ id: 'baseline', type: 'line', source: 'baseline', paint: { 'line-color': '#777', 'line-width': 4, 'line-opacity': 0.7 } });
  map.addLayer({ id: 'runway', type: 'line', source: 'runway', paint: { 'line-color': '#0b6bcb', 'line-width': 4 } });
  map.addLayer({ id: 'nosidewalk', type: 'line', source: 'nosidewalk', paint: { 'line-color': '#8e44ad', 'line-width': 7, 'line-opacity': 0.6, 'line-dasharray': [1, 1] } });
  map.addLayer({ id: 'events', type: 'circle', source: 'events', paint: { 'circle-radius': 6, 'circle-color': ['get', 'color'], 'circle-stroke-color': ['get', 'stroke'], 'circle-stroke-width': ['get', 'width'] } });
  map.addLayer({ id: 'start', type: 'circle', source: 'start', paint: { 'circle-radius': 8, 'circle-color': '#14833b', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  show();
});
select.onchange = show;
document.getElementById('base').onchange = show;
</script>
</body>
</html>
